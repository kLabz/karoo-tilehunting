syntax = "proto3";
option java_package = "bzh.klabz.squadrating.data";
option java_multiple_files = true;

message UserPreferences {
  string statshuntersSharecode = 2;
  uint32 squadratDrawRange = 3;
  bool hideSquadratGridLines = 4;
  bool areSquadratsDisabled = 5;
  uint32 squadratinhoDrawRange = 6;
  bool hideSquadratinhoGridLines = 7;
  bool areSquadratinhosDisabled = 8;
}
